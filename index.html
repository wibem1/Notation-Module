<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Notation Module 0.1.23</title>
<link rel="manifest" href="./manifest.webmanifest?v=0.1.23">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Notation Module">
<script src="https://cdn.jsdelivr.net/npm/abcjs@6.5.2/dist/abcjs-basic-min.js"></script>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#202124;background:#eef1f4}*{box-sizing:border-box}
body{margin:0}header{padding:12px 18px;background:#fff;border-bottom:1px solid #c9ced4;display:flex;justify-content:space-between}
main{display:grid;grid-template-columns:minmax(280px,38%) 1fr;gap:12px;padding:12px;height:calc(100vh - 51px)}
.panel{background:#fff;border:1px solid #c9ced4;border-radius:10px;overflow:auto;padding:14px}
h2{font-size:15px;margin:0 0 10px}textarea{width:100%;height:calc(100% - 78px);min-height:300px;border:1px solid #adb5bd;border-radius:7px;padding:10px;font:15px/1.45 ui-monospace,SFMono-Regular,monospace;resize:none}
.toolbar{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}button{padding:7px 11px;border:1px solid #9aa0a6;border-radius:7px;background:#f8f9fa;font:inherit}button:hover{background:#e9ecef}
.instrumentToolbar,.scaleToolbar{align-items:center;margin:0 0 8px}.instrumentToolbar select{padding:6px 9px;border:1px solid #9aa0a6;border-radius:7px;background:#fff;font:inherit}.scaleToolbar strong{min-width:52px;text-align:center;font-size:13px}#paper{overflow:hidden;width:100%}#paper svg{display:block;height:auto}.status{font-size:12px;color:#5f6368}
@media(max-width:750px){main{grid-template-columns:1fr;height:auto}textarea{height:38vh}.panel{min-height:44vh}}
@page{size:A4 portrait;margin:15mm}
@media print{
  html,body{width:100%;background:#fff!important}
  header,.editorPanel,.scorePanel>h2,.toolbar,.status{display:none!important}
  body,main,.panel{background:#fff!important;border:0!important;padding:0!important;margin:0!important}
  main{display:block!important;height:auto!important}
  .scorePanel{display:block!important;overflow:visible!important}
  #paper{width:100%!important}
  #paper svg{display:block!important;width:100%!important;max-width:none!important;height:auto!important;break-inside:avoid;page-break-inside:avoid}
}
</style></head><body>
<header><strong>Notation Module</strong><span class="status">Test-WebApp · v0.1.23</span></header>
<main>
<section class="panel editorPanel"><h2>ABC</h2><textarea id="abc">X:1
T:Notation Module – Mehrstimmigkeitstest

[V:Pno] z2 | [DFA]4 [CFA]4 | [B,DG]4 [A,CE]4 | [DFA]4 [A,CE]4 | [DFA]6 z2 |]</textarea>
<div class="toolbar"><button id="render">Aktualisieren</button><button id="saveABC">ABC speichern</button><button id="saveMIDI">MIDI speichern</button><button id="resetABC">Zurücksetzen</button></div></section>
<section class="panel scorePanel"><h2>Noten</h2><div class="toolbar instrumentToolbar"><label for="instrument">Instrument</label><select id="instrument"></select></div><div class="toolbar scaleToolbar"><span>Darstellung</span><button id="scaleDown" title="Noten kleiner">−</button><strong id="scaleValue">100 %</strong><button id="scaleUp" title="Noten größer">+</button></div><div id="paper"></div><div class="toolbar"><button id="play">▶ Play</button><button id="stop">■ Stop</button><button id="print">Drucken / PDF</button></div><p id="status" class="status"></p></section>
</main>
<script type="module" src="./src/test-app.js?v=0.1.23"></script><script>if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js?v=0.1.23").catch(()=>{}));}</script></body></html>
