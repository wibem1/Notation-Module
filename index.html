<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Notation Module 0.1.0</title>
<script src="https://cdn.jsdelivr.net/npm/abcjs@6.5.2/dist/abcjs-basic-min.js"></script>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#202124;background:#eef1f4}*{box-sizing:border-box}
body{margin:0}header{padding:12px 18px;background:#fff;border-bottom:1px solid #c9ced4;display:flex;justify-content:space-between}
main{display:grid;grid-template-columns:minmax(280px,38%) 1fr;gap:12px;padding:12px;height:calc(100vh - 51px)}
.panel{background:#fff;border:1px solid #c9ced4;border-radius:10px;overflow:auto;padding:14px}
h2{font-size:15px;margin:0 0 10px}textarea{width:100%;height:calc(100% - 78px);min-height:300px;border:1px solid #adb5bd;border-radius:7px;padding:10px;font:15px/1.45 ui-monospace,SFMono-Regular,monospace;resize:none}
.toolbar{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}button{padding:7px 11px;border:1px solid #9aa0a6;border-radius:7px;background:#f8f9fa;font:inherit}button:hover{background:#e9ecef}
#paper svg{max-width:100%;height:auto}.status{font-size:12px;color:#5f6368}
@media(max-width:750px){main{grid-template-columns:1fr;height:auto}textarea{height:38vh}.panel{min-height:44vh}}
@media print{header,.editorPanel{display:none!important}body,main,.panel{background:#fff;border:0;padding:0;margin:0}main{display:block;height:auto}.scorePanel{overflow:visible}button,.status{display:none!important}#paper svg{width:100%}}
</style></head><body>
<header><strong>Notation Module</strong><span class="status">Test-WebApp · v0.1.0</span></header>
<main>
<section class="panel editorPanel"><h2>ABC</h2><textarea id="abc">X:1
T:Notation Module – Test
C:
M:3/4
L:1/8
Q:1/4=84
K:Dm
V:1 name="Violine" clef=treble
|: D2 F2 A2 | d3 c B2 | A2 G2 F2 | E6 :|</textarea>
<div class="toolbar"><button id="render">Aktualisieren</button><button id="saveABC">ABC speichern</button></div></section>
<section class="panel scorePanel"><h2>Noten</h2><div id="paper"></div><div class="toolbar"><button id="play">▶ Play</button><button id="stop">■ Stop</button><button id="print">Drucken / PDF</button></div><p id="status" class="status"></p></section>
</main>
<script type="module" src="./src/test-app.js"></script></body></html>
